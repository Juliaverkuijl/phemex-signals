<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phemex Signals v49</title><style>body{background:#0b1220;color:#eef3fa;font:15px system-ui;margin:0}main{max-width:600px;margin:auto;padding:16px}h1{font-size:24px}h2{font-size:18px}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #344962;background:#17263a;color:white;box-sizing:border-box;width:100%}button{background:#2868c7;font-weight:700;margin:8px 0}small,p{color:#a8b7cc}article{background:#151f30;border-radius:12px;padding:12px;margin:8px 0}summary{cursor:pointer}.line{display:flex;justify-content:space-between;gap:8px}.long{color:#5ad4a4}.short{color:#ff9292}svg{width:100%;height:auto}progress{width:100%}</style><main><h1>Phemex Signals <small>v49</small></h1><p>Technische watchlist · 5m / 15m · 4H / 1D</p><button id="scan">↻ Scan vernieuwen</button><small id="status">Nog niet gescand</small><progress id="progress" value="0" max="1"></progress><h2 class="long">▲ LONG-kansen</h2><div id="long">—</div><h2 class="short">▼ SHORT-kansen</h2><div id="short">—</div><details><summary>Verbinding</summary><input id="proxy" type="url"><button id="save">Opslaan</button></details><p><small>Alleen USDT-perpetuals met publiek contractmaximum ≥20x. Geen orders, instapprijzen of hefboomadvies. Score is een technische heuristiek, geen winstkans. Niet gebacktest.</small></p></main><script>const API='https://api.phemex.com',el=id=>document.getElementById(id);let proxy=localStorage.getItem('phemex_proxy_v3')||'https://phemex-signals-api.keukenkast22.workers.dev';el('proxy').value=proxy;el('save').onclick=()=>{const v=el('proxy').value.trim();if(v&&!/^https:\/\/[a-z0-9.-]+\/?$/i.test(v))return;proxy=v;localStorage.setItem('phemex_proxy_v3',v);};
function avg(a){return a.reduce((x,y)=>x+y,0)/a.length}function ema(a,n){let k=2/(n+1),v=avg(a.slice(0,n));return a.slice(n).reduce((p,x)=>x*k+p*(1-k),v)}
function rsi(a,n=14){if(a.length<n+1)return NaN;let gains=0,losses=0;for(let i=1;i<=n;i++){let d=a[i]-a[i-1];gains+=Math.max(0,d);losses+=Math.max(0,-d)}let g=gains/n,l=losses/n;for(let i=n+1;i<a.length;i++){let d=a[i]-a[i-1];g=(g*(n-1)+Math.max(0,d))/n;l=(l*(n-1)+Math.max(0,-d))/n}return l===0?100:100-100/(1+g/l)}
function atr(c,n=14){let t=[];for(let i=1;i<c.length;i++)t.push(Math.max(c[i].high-c[i].low,Math.abs(c[i].high-c[i-1].close),Math.abs(c[i].low-c[i-1].close)));return avg(t.slice(-n))}
async function getJson(url){const path=url.replace(API,'');let target=proxy?proxy.replace(/\/$/,'')+path:url;let controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{let r=await fetch(target,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(j.code!==undefined&&j.code!==0)throw Error(j.msg||'Phemex fout '+j.code);return j}finally{clearTimeout(timeout)}}

function parseCandles(j){let raw=j.data?.rows||j.data?.candles||[];if(!Array.isArray(raw)||!raw.length)throw Error('Geen koerscandles ontvangen');let arr=raw.map(r=>Array.isArray(r)?(r.length>=9?{time:Number(r[0]),open:Number(r[3]),high:Number(r[4]),low:Number(r[5]),close:Number(r[6]),volume:Number(r[7]||0)}:{time:Number(r[0]),open:Number(r[1]),high:Number(r[2]),low:Number(r[3]),close:Number(r[4]),volume:Number(r[5]||0)}):{time:Number(r.timestamp||r.time),open:Number(r.open),high:Number(r.high),low:Number(r.low),close:Number(r.close),volume:Number(r.volume||0)}).filter(x=>[x.open,x.high,x.low,x.close].every(Number.isFinite)).sort((a,b)=>a.time-b.time);if(arr.length<70)throw Error('Te weinig candles voor analyse');return arr}
async function fetchLastPrice(sym){
  const j=await getJson(API+'/md/v2/ticker/24hr?symbol='+encodeURIComponent(sym));
  const d=j.result?.ticker||j.result||j.data?.ticker||j.data?.result||j.data||j;
  if(j.error)throw Error('Phemex ticker fout: '+String(j.error));
  const obj=Array.isArray(d)?d.find(x=>x.symbol===sym):d;
  if(!obj||typeof obj!=='object')throw Error('Geen Phemex ticker ontvangen');
  // Phemex USDT perpetuals gebruiken Rp (real price), oudere contracten Ep (1e8 schaal).
  let price=NaN;
  for(const key of ['lastRp','lastPriceRp','closeRp','last','lastPrice']){
    if(obj[key]!==undefined&&obj[key]!==null){price=Number(obj[key]);if(Number.isFinite(price)&&price>0)break;}
  }
  if(!(price>0))for(const key of ['lastEp','closeEp','lastPriceEp']){
    if(obj[key]!==undefined){price=Number(obj[key])/1e8;if(Number.isFinite(price)&&price>0)break;}
  }
  if(!(price>0))throw Error('Last Price ontbreekt in Phemex ticker');
  if(obj.timestamp){const ts=Number(obj.timestamp);const ms=ts>1e16?ts/1e6:ts>1e13?ts/1e3:ts>1e11?ts:ts*1000;if(!Number.isFinite(ms)||Math.abs(Date.now()-ms)>120000)throw Error('Phemex ticker is ouder dan 2 minuten');}
  return price;
}

const contractLimits=new Map();

function cacheContractLimits(data){
  contractLimits.clear();
  const margins=data?.leverageMargins||[];
  const groups=new Map(margins.map(g=>[String(g.index_id??g.indexId??g.id),g]));
  const products=[...(data?.perpProductsV2||[]),...(data?.products||[])];
  for(const product of products){
    const sym=product?.symbol;if(!sym||!sym.endsWith('USDT'))continue;
    const ref=product.leverageMargin;
    const idx=typeof ref==='object'?(ref.index_id??ref.indexId??ref.id):ref;
    const group=groups.get(String(idx));
    const tiers=group?.items||group?.tiers||[];
    // Eerste tier is alleen geldig voor kleine posities; zonder positiegrootte geen persoonlijke max.
    const tierMax=tiers.map(t=>Number(t.maxLeverage)).filter(n=>Number.isFinite(n)&&n>=1&&n<=500);
    const direct=Number(product.maxLeverage);
    const max=tierMax.length?Math.max(...tierMax):(Number.isFinite(direct)&&direct>=1&&direct<=500?direct:null);
    if(max!==null){
      // Alleen expliciet als percentage gemarkeerde MMR-velden automatisch interpreteren.
      // Onbekende eenheden (bijv. 0.005 versus 0.5%) worden nooit geraden.
      const t=tiers[0]||{};
             // Phemex geeft de MMR afhankelijk van contractversie als percentage of fractie.
       // Alleen benoemde, ondubbelzinnige velden accepteren; nooit een default verzinnen.
       function readMmr(tier,prod){
         // Percentage en fractie worden uitsluitend op basis van de expliciete veldnaam gelezen.
         for(const obj of [tier,prod]){
           if(!obj||typeof obj!=='object')continue;
           for(const key of ['maintenanceMarginRatePercent','maintenanceMarginPercent','maintMarginRatePercent','mmrPercent']){
             if(obj[key]!=null&&obj[key]!==''){const n=Number(obj[key]);if(Number.isFinite(n)&&n>0&&n<20)return n;}
           }
           for(const key of ['maintenanceMarginRate','maintMarginRate','maintenanceMarginRatio','mmrRate','maintenanceMarginRateRr']){
             if(obj[key]!=null&&obj[key]!==''){const n=Number(obj[key]);if(Number.isFinite(n)&&n>0&&n<0.2)return n*100;}
           }
         }
         return NaN;
       }
       // Bij meerdere tiers is de juiste tier niet te bewijzen zonder exacte USDT-notional.
       // EUR-equivalent is daarvoor onvoldoende. Geen MMR van tier 1 als definitief presenteren.
       const mmr=tiers.length===1?readMmr(tiers[0],product):tiers.length===0?readMmr(null,product):NaN;
       const mmrStatus=Number.isFinite(mmr)?'Phemex contractgegevens':tiers.length>1?'Risicotier niet vast te stellen zonder USDT-notional':'MMR ontbreekt in Phemex contractgegevens';
const tickRaw=Number(product.tickSizeRp??product.priceTickRp??product.tickSize??NaN);
      const prec=Number(product.pricePrecision);
      const tick=Number.isFinite(tickRaw)&&tickRaw>0&&tickRaw<100000?tickRaw:Number.isInteger(prec)&&prec>=0&&prec<=12?10**(-prec):NaN;
      contractLimits.set(sym,{tick,max:Math.floor(max),source:tierMax.length?'Phemex leverageMargins':'Phemex product',tiers,mmr,mmrStatus});
    }
  }
}
function contractLimit(sym){return contractLimits.get(sym)||null;}

function activePerpetuals(data){
  const v2=(data?.perpProductsV2||[]).filter(p=>p&&typeof p.symbol==='string');
  const old=(data?.products||[]).filter(p=>p&&typeof p.symbol==='string'&&(
    /perpetual|perp/i.test(String(p.type||p.contractType||p.displayType||'')) ||
    p.perpetual===true || p.perpetual===1 || p.perpetual==='1'
  ));
  const listed=p=>(!p.status||['Listed','Trading','Open'].includes(p.status))&&p.symbol.toUpperCase().endsWith('USDT');
  return [...new Set([...v2,...old].filter(listed).map(p=>p.symbol))].sort();
}

async function frame(sym,res){const to=Math.floor(Date.now()/1000/res)*res;const j=await getJson(API+'/exchange/public/md/v2/kline/list?symbol='+encodeURIComponent(sym)+'&resolution='+res+'&from='+(to-200*res)+'&to='+to);const now=Date.now()/1000;const c=parseCandles(j).filter(x=>x.time+res<=now-2);if(c.length<70||now-c.at(-1).time-res>res+120)throw Error('Verouderde candles');return c;}
function metrics(c){const a=c.map(x=>x.close),last=a.at(-1),e=ema(a,20),slow=ema(a,50),slope=e-ema(a.slice(0,-4),20),range=atr(c),r=rsi(a),vol=avg(c.slice(-21,-1).map(x=>x.volume)),ratio=vol>0?c.at(-1).volume/vol:0;return {last,e,slow,slope,range,r,ratio,hi:Math.max(...c.slice(-21,-1).map(x=>x.high)),lo:Math.min(...c.slice(-21,-1).map(x=>x.low)),mom:last-a.at(-5)};}
function trend(m,d){return d*(m.e-m.slow)>0&&d*(m.last-m.e)>0&&d*m.slope>0;}
function assess(m,h,day,other,d){if(!(m.range>0)||!trend(h,d)||!trend(day,d))return null;const level=d===1?m.hi:m.lo,dist=d*(level-m.last)/m.range;const breakout=dist<=0&&dist>=-1&&m.ratio>=1.2;const near=dist>0&&dist<=.6&&d*m.mom>0;const checks=[d*(m.last-m.e)>0,d*(m.e-m.slow)>0,d*m.slope>0,d*m.mom>0,d===1?m.r>=52&&m.r<=75:m.r<=48&&m.r>=25,m.ratio>=1.2,trend(other,d),breakout||near,true,true];const score=checks.filter(Boolean).length;if(score<8||!checks[3]||!checks[4]||!checks[0]||!(breakout||near||checks[5]&&checks[6]))return null;return {score,reason:breakout?'Uitbraak op gesloten candle':near?'Nadert uitbraakniveau':'Trend en momentum',ratio:m.ratio,r:m.r};}
async function inspect(sym){const [a,b,h,j]=await Promise.all([frame(sym,300),frame(sym,900),frame(sym,14400),frame(sym,86400)]);const m=metrics(a),n=metrics(b),H=metrics(h),D=metrics(j),last=await fetchLastPrice(sym);const out=[];for(const [c,x,y,tf] of [[a,m,n,'5m'],[b,n,m,'15m']])for(const d of [1,-1]){const z=assess(x,H,D,y,d);if(z&&Math.abs(last-x.last)<=x.range*.8)out.push({...z,sym,tf,d,last,c,at:Date.now(),other:trend(y,d)});}return out.sort((a,b)=>b.score-a.score||b.ratio-a.ratio)[0];}
function row(x){const a=document.createElement('article');a.dataset.created=x.at;const line=document.createElement('div');line.className='line';const name=document.createElement('strong');name.textContent=x.sym+' · '+x.tf;const score=document.createElement('strong');score.textContent=x.score+'/10';score.className=x.d===1?'long':'short';line.append(name,score);const p=document.createElement('small');p.textContent=x.reason+' · 4H/1D akkoord · '+(x.other?'5m/15m akkoord':'ander kort timeframe gemengd')+' · '+new Date(x.at).toLocaleTimeString('nl-NL');const det=document.createElement('details');const sum=document.createElement('summary');sum.textContent='Grafiek en details';det.append(sum);const info=document.createElement('p');info.textContent='Koers bij scan: '+x.last+' · RSI '+x.r.toFixed(1)+' · volume '+x.ratio.toFixed(2)+'×';det.append(info);const c=x.c.slice(-60),lo=Math.min(...c.map(v=>v.low)),hi=Math.max(...c.map(v=>v.high)),y=v=>8+144*(hi-v)/Math.max(hi-lo,1e-12);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 360 160');for(let i=0;i<c.length;i++){const v=c[i],color=v.close>=v.open?'#5ad4a4':'#ff9292';for(const [tag,attrs] of [['line',{x1:i*6+3,x2:i*6+3,y1:y(v.high),y2:y(v.low),stroke:color}],['rect',{x:i*6+1,y:Math.min(y(v.open),y(v.close)),width:4,height:Math.max(1,Math.abs(y(v.open)-y(v.close))),fill:color}]]){const e=document.createElementNS(svg.namespaceURI,tag);for(const [k,val] of Object.entries(attrs))e.setAttribute(k,val);svg.append(e);}}det.append(svg);a.append(line,p,det);return a;}
let running=false,cancel=false;el('scan').onclick=async()=>{if(running){cancel=true;return;}running=true;cancel=false;el('scan').textContent='Stop scan';el('long').textContent='—';el('short').textContent='—';let count=0,errors=0,results=[];try{const j=await getJson(API+'/public/products');cacheContractLimits(j.data);const all=activePerpetuals(j.data).filter(s=>contractLimit(s)?.max>=20);if(!all.length)throw Error('Geen geschikte contracten');el('progress').max=all.length;el('progress').value=0;let i=0;await Promise.all(Array.from({length:3},async()=>{while(!cancel&&i<all.length){const sym=all[i++];try{const x=await inspect(sym);if(x)results.push(x);}catch(e){errors++;}count++;el('progress').value=count;el('status').textContent=count+'/'+all.length+' · '+errors+' zonder data';await new Promise(r=>setTimeout(r,300));}}));for(const [id,d] of [['long',1],['short',-1]]){const list=results.filter(x=>x.d===d&&Date.now()-x.at<=300000).sort((a,b)=>b.score-a.score||b.ratio-a.ratio).slice(0,5);el(id).replaceChildren(...list.map(row));if(!list.length)el(id).textContent='Geen recente sterke kandidaten.';}el('status').textContent=(cancel?'Gestopt':'Afgerond')+' · '+count+'/'+all.length+' · '+errors+' zonder data · resultaten maximaal 5 min oud bij afronding';}catch(e){el('status').textContent='Scan mislukt: '+e.message;}finally{running=false;el('scan').textContent='↻ Scan vernieuwen';}};
setInterval(()=>{if(!running){for(const id of ['long','short'])for(const a of el(id).querySelectorAll('article')){if(!a.dataset.created)a.dataset.created=Date.now();if(Date.now()-Number(a.dataset.created)>300000)a.remove();} }},10000);
</script></html>
